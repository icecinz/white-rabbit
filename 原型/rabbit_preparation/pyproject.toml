[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbit-preparation"
version = "0.1.3"
description = "Pure conversation and material preparation for native Agent input"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rabbit-content>=0.1.1,<0.2"]

[tool.setuptools]
packages = ["rabbit_preparation"]
package-dir = {rabbit_preparation = "."}
include-package-data = false
