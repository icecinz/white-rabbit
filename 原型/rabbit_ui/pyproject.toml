[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbit-ui"
version = "0.1.0"
description = "Static Rabbit chat, management and settings UI for a compatible HTTP host"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["rabbit_ui"]
package-dir = {rabbit_ui = "."}
include-package-data = false

[tool.setuptools.package-data]
rabbit_ui = ["assets/*"]
