[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbit-content"
version = "0.1.1"
description = "Independent local content snapshots, publication receipts and Markdown organization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10"]

[tool.setuptools]
packages = ["rabbit_content"]
package-dir = {rabbit_content = "."}
include-package-data = false
